services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kavach
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
